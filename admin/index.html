<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | S. Baruah Foodyverse</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-login-wrapper">
        <div class="admin-login-card">
            <h2 style="font-family: var(--font-heading); margin-bottom: 0.5rem; color: var(--text-primary);">Foodyverse Admin</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9rem;">Secure access for authorized personnel only.</p>
            
            <form id="adminLoginForm">
                <div style="margin-bottom: 1rem; text-align: left;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem;">Username</label>
                    <input type="text" id="adminUser" required style="width: 100%; padding: 0.8rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary);">
                </div>
                <div style="margin-bottom: 1.5rem; text-align: left;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem;">Password</label>
                    <input type="password" id="adminPass" required style="width: 100%; padding: 0.8rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary);">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Secure Login</button>
                <div id="loginError" style="color: #dc3545; margin-top: 1rem; font-size: 0.85rem; display: none;">Invalid credentials.</div>
            </form>
        </div>
    </div>
    
    <script src="../js/admin.js"></script>
</body>
</html>
