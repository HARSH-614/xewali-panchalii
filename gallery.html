<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | S. Baruah Foodyverse</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .gallery-item { width: 100%; height: 250px; object-fit: cover; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; transition: var(--transition-smooth); }
        .gallery-item:hover { border-color: var(--accent-primary); transform: translateY(-3px); box-shadow: var(--shadow-subtle); }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo-brand">
                <span class="logo-text">S. Baruah Foodyverse</span>
            </a>
            <nav class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="menu.html" class="nav-link">Full Menu</a>
                <a href="gallery.html" class="nav-link active">Gallery</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-btn" id="theme-toggle">🌙</button>
            </div>
        </div>
    </header>

    <main class="container" style="padding: 5rem 1.5rem; min-height: 70vh;">
        <h1 class="section-title" style="text-align: center; margin-bottom: 3rem;">Visual Journey</h1>
        
        <div class="gallery-grid">
            <img src="https://share.google/rCYKo0Jvg6ytEoyDL" alt="Garden Seating" class="gallery-item">
            <img src="https://share.google/ibs0eLnHZVALujQDI" alt="Assamese Thali Details" class="gallery-item">
            <img src="https://share.google/hdsaQDk62PwYO4xZo" alt="Cozy Couple Table" class="gallery-item">
            <img src="https://share.google/aiJ9hCuiMQQwoQG6N" alt="Assamese Thali Spread" class="gallery-item">
            <img src="https://share.google/RJKicPW0EEOdLKwKu" alt="Evening Lighting" class="gallery-item">
            <img src="https://share.google/yTAUNbxXu2oe3DwwB" alt="Wood-Fired Pizza" class="gallery-item">
        </div>
    </main>

    <footer class="footer">
        <div class="container" style="text-align: center;">
            <p>&copy; 2026 S. Baruah Foodyverse. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
</body>
</html>
