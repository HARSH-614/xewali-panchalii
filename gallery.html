<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | S. Baruah Foodyverse</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .gallery-item { height: 250px; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-family: var(--font-heading); font-size: 1.25rem; transition: var(--transition-smooth); }
        .gallery-item:hover { border-color: var(--accent-primary); transform: translateY(-3px); }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo-brand">
                <span class="logo-text">S. Baruah Foodyverse</span>
            </a>
            <nav class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="menu.html" class="nav-link">Full Menu</a>
                <a href="gallery.html" class="nav-link active">Gallery</a>
            </nav>
            <div class="nav-actions">
                <button class="icon-btn" id="theme-toggle">🌙</button>
            </div>
        </div>
    </header>

    <main class="container" style="padding: 5rem 1.5rem; min-height: 70vh;">
        <h1 class="section-title" style="text-align: center; margin-bottom: 3rem;">Visual Journey</h1>
        
        <div class="gallery-grid">
            <div class="gallery-item" style="background: linear-gradient(135deg, #2d5a3e, #1c261e); color: #fff;">Garden Seating</div>
            <div class="gallery-item" style="background: linear-gradient(135deg, #3a7550, #2c3e30); color: #fff;">Masor Tenga Prep</div>
            <div class="gallery-item" style="background: linear-gradient(135deg, #1c261e, #0f1410); color: #fff;">Cozy Couple Table</div>
            <div class="gallery-item" style="background: linear-gradient(135deg, #d4af37, #b5952f); color: #fff;">Assamese Thali</div>
            <div class="gallery-item" style="background: linear-gradient(135deg, #4a5c4d, #27362a); color: #fff;">Evening Lighting</div>
            <div class="gallery-item" style="background: linear-gradient(135deg, #2d5a3e, #1c261e); color: #fff;">Wood-Fired Pizza</div>
        </div>
    </main>

    <footer class="footer">
        <div class="container" style="text-align: center;">
            <p>&copy; 2026 S. Baruah Foodyverse. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
</body>
</html>
